[package]
name = "trunkdb-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
trunkdb = { path = "..", features = ["fuzzing"] }

# `cargo fuzz` builds with `--cfg fuzzing`, and so does the smoke run.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

# Its own workspace, like `bench/`.
[workspace]
members = ["."]

[[bin]]
name = "open_file"
path = "fuzz_targets/open_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open_raw"
path = "fuzz_targets/open_raw.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recover_wal"
path = "fuzz_targets/recover_wal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import"
path = "fuzz_targets/import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "queries"
path = "fuzz_targets/queries.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filter_text"
path = "fuzz_targets/filter_text.rs"
test = false
doc = false
bench = false
