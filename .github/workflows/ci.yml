name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  lint:
    name: Clippy and rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The `fuzzing` feature's hooks too (SPEC §55).
      - run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    name: Minimum Rust version (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  bench:
    name: Benchmark (builds, lints, runs small)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench
      - run: cargo fmt --check --manifest-path bench/Cargo.toml
      - run: cargo clippy --manifest-path bench/Cargo.toml -- -D warnings
      # Every store must give the same answers; the times don't matter here.
      - run: cargo run --release --manifest-path bench/Cargo.toml -- 20000

  fuzz:
    name: Fuzz targets (build and lint; fuzzing runs by hand, SPEC §55)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
