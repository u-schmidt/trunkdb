name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      # `#[trunkdb::document]` and its compile-fail tests (SPEC §114).
      - run: cargo test --features derive

  ffi:
    name: C ABI and C# (${{ matrix.os }}; SPEC §179, §180)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every function called through raw pointers, and the header
      # compared with what the code says.
      - run: cargo test -p trunkdb-ffi
      # A C program calling every function, under AddressSanitizer.
      - if: runner.os != 'Windows'
        run: sh trunkdb-ffi/tests/c/run.sh
      # The C# wrapper's tests, against the library built here (SPEC §180).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: cargo build -p trunkdb-ffi
      - run: dotnet test bindings/dotnet/tests/TrunkDb.Tests

  lint:
    name: Clippy and rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The `fuzzing` feature's hooks (SPEC §55) and the macro crate
      # (SPEC §114) too.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Without the default `regex` feature (SPEC §169): it builds,
      # lints and refuses `matches` in a filter's text, saying why.
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --no-default-features --lib

  msrv:
    name: Minimum Rust version (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      # `#[trunkdb::document]` and its compile-fail tests (SPEC §114).
      - run: cargo test --features derive
      # The C ABI's library builds with it too (SPEC §179).
      - run: cargo build -p trunkdb-ffi

  bench:
    name: Benchmark (builds, lints, runs small)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench
      - run: cargo fmt --check --manifest-path bench/Cargo.toml
      - run: cargo clippy --manifest-path bench/Cargo.toml -- -D warnings
      # Every store must give the same answers; the times don't matter here.
      - run: cargo run --release --manifest-path bench/Cargo.toml -- 20000

  fuzz:
    name: Fuzz targets (build, lint, random queries programs; guided fuzzing runs by hand, SPEC §55, §105)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      # The targets' valid database builds (SPEC §55.1): a write it makes
      # that trunkdb came to refuse (§95) left them all panicking, unseen.
      - run: cargo run --release --manifest-path fuzz/Cargo.toml --example seed_corpus
      # The `queries` target on random programs, on stable (SPEC §105.4),
      # from a new seed each run. A failing program names its seed and is
      # kept as an artifact, for `cargo fuzz run queries <file>`.
      - run: cargo run --release --manifest-path fuzz/Cargo.toml --example queries_smoke -- 400 ${{ github.run_id }}
        env:
          RUSTFLAGS: --cfg fuzzing
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: queries-program
          path: fuzz/artifacts/queries/
