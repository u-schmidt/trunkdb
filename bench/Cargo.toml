[package]
name = "trunkdb-bench"
version = "0.1.0"
edition = "2024"
publish = false
# `cargo run` runs the comparison; `--bin reader_wait` the other one.
default-run = "trunkdb-bench"
description = "trunkdb against SQLite, redb and sled on one document workload (SPEC §48)"

[dependencies]
trunkdb = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
redb = "4"
sled = "0.34"

# Its own workspace: the comparison databases never become part of
# trunkdb's build, tests or CI.
[workspace]
