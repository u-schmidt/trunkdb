[package]
name = "trunkdb"
version = "0.9.0"
edition = "2024"
rust-version = "1.89"
description = "An embedded, single-file, schema-less document database — a learning-first, from-scratch reimplementation of the LiteDB idea in Rust."
license = "MIT"
repository = "https://github.com/u-schmidt/trunkdb"
# The benchmark is its own crate, with its own dependencies (SPEC §48).
exclude = ["bench/"]

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v7"] }
indexmap = "2"
thiserror = "2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
tempfile = "3"
