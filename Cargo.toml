[package]
name = "trunkdb"
version = "0.39.0"
edition = "2024"
rust-version = "1.89"
description = "An embedded, single-file, schema-less document database: crash-safe batches, secondary indexes, snapshot reads and a text query language, built from the page layer up."
license = "MIT"
repository = "https://github.com/u-schmidt/trunkdb"
readme = "README.md"
keywords = ["database", "embedded", "document", "nosql", "storage"]
categories = ["database-implementations", "database"]
# The benchmark and the fuzz targets are crates of their own, with their
# own dependencies (SPEC §48, §55).
exclude = ["assets/", "bench/", "fuzz/", "skills/", "tests/fixtures/"]

# The `derive` feature's macro crate (SPEC §114), and the C ABI (SPEC
# §177, §179). `bench/` and `fuzz/` are workspaces of their own.
[workspace]
members = ["trunkdb-derive", "trunkdb-ffi"]

[features]
default = ["regex"]
# `Filter::regex` and `matches` in a filter's text, through the `regex`
# crate (SPEC §169). On by default; off, a build without them has two
# dependencies fewer.
regex = ["dep:regex", "dep:regex-syntax"]
# Hooks for the fuzz targets in `fuzz/` (SPEC §55); not for applications,
# and not part of the API: they change with the fuzz targets, in any
# release (SPEC §118).
# It switches nothing off: skipping the flush is `--cfg fuzzing`, which
# `cargo fuzz` sets and a feature can't (SPEC §55.1).
fuzzing = []
# `#[trunkdb::document]` and `#[id]`, from the trunkdb-derive crate
# (SPEC §114).
derive = ["dep:trunkdb-derive"]

[package.metadata.docs.rs]
features = ["derive"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v7"] }
indexmap = "2"
thiserror = "2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
trunkdb-derive = { path = "trunkdb-derive", version = "0.22.0", optional = true }
regex = { version = "1.10", optional = true, default-features = false, features = ["std", "unicode", "perf"] }
regex-syntax = { version = "0.8", optional = true, default-features = false, features = ["std", "unicode"] }

[dev-dependencies]
tempfile = "3"
# Only for tests/other_date_crates.rs, which checks what GUIDE.md says
# about them: neither is a dependency of trunkdb.
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
jiff = { version = "0.2", features = ["serde"] }
trybuild = "1"
regex = "1.10"
